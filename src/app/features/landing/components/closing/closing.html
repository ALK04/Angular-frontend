<section class="closing">
  <div class="shell">
    <div class="panel">
      <span class="grid-bg" aria-hidden="true"></span>

      <div class="panel-inner">
        <p class="lbl" [appReveal]="0">Prêt à composer</p>
        <h2 [appReveal]="80">Composez votre interface.<br><span class="accent">Le code suit.</span></h2>

          React&nbsp;+&nbsp;Node prêt à coder. Le reste du temps, gardez-le pour

        <a class="btn" routerLink="/composer" [appReveal]="240">

        </a>

      </div>
    </div>
  </div>
</section>
