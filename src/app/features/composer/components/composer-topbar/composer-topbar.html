<header class="topbar">

  <!-- ── Gauche ── -->
  <div class="topbar-left">

    <!-- Bouton retour -->
    <button type="button" class="back-btn" (click)="goBack()" aria-label="Retour à l'étape précédente">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <path d="M8.5 11L4.5 6.5 8.5 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Retour</span>
    </button>

    <div class="topbar-vsep" aria-hidden="true"></div>

    <!-- Logo Calque -->
    <a class="brand" routerLink="/" aria-label="Page d'accueil Calque">
      <span class="brand-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2.5" y="7" width="15" height="11" rx="2.5"
            fill="rgba(91,61,245,0.22)" stroke="rgba(91,61,245,0.75)" stroke-width="1.3"/>
          <rect x="5"   y="4" width="11" height="11" rx="2.5"
            fill="rgba(91,61,245,0.12)" stroke="rgba(91,61,245,0.45)" stroke-width="1.2"/>
          <rect x="7.5" y="1.5" width="7" height="8" rx="2"
            fill="rgba(91,61,245,0.07)" stroke="rgba(91,61,245,0.28)" stroke-width="1.1"/>
        </svg>
      </span>
      <span class="brand-name">Calque</span>
    </a>

    <!-- Fil d'Ariane -->
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="crumb">{{ projectName }}</span>

  </div>

  <!-- ── Droite ── -->
  <div class="topbar-right">

    <!-- Brouillon local -->
    @if (store.draftSavedAt(); as savedAt) {
      <span class="draft-badge" [title]="savedAtLabel(savedAt)">
        <span class="draft-dot" aria-hidden="true"></span>
        Brouillon enregistré
      </span>
    }

    @if (store.navbarId()) {
      <button
        type="button"
        class="reset-btn"
        [class.is-confirming]="confirmingReset()"
        (click)="askReset()"
      >
        @if (confirmingReset()) { Confirmer ? } @else { Recommencer }
      </button>
    }

    <div class="theme-zone">
      <span class="theme-label" aria-hidden="true">Thème</span>
      <app-accent-picker />
    </div>
  </div>

</header>
